[project]
name = "aximux"
version = "0.1.0"
description = "Configurable FPGA signal multiplexer with AXI4-Lite control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hdltools",
]

[dependency-groups]
dev = [
    "cocotb>=2",
    "cocotb-test>=0.2.6",
    "cocotbext-axi>=0.1.24",
]

[tool.uv]
package = false

[tool.uv.sources]
hdltools = { path = "../hdltools", editable = true }
